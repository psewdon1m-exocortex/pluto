name: Pluto verify
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: go test -race -count=1 ./... && go vet ./...
      - run: sh -n packaging/bootstrap.sh && python3 scripts/test-known-problems-gate.py && node --test scripts/verify-release.test.mjs
      - name: Isolated bootstrap failure regression
        run: docker run --rm --env PLUTO_BOOTSTRAP_FIXTURE=1 -v "$PWD:/workspace:ro" -w /workspace node:24-bookworm node --test scripts/bootstrap.test.mjs
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...
      - run: python3 scripts/known-problems-gate.py --phase structure
