name: Package 7 Pluto candidate qualification
on:
  push:
    branches: ["release-qualification/package7-*"]
permissions:
  contents: read
concurrency:
  group: package7-pluto-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-ordinary-ci:
    uses: ./.github/workflows/verify.yml
    with:
      qualification_source_manifest: .release/package7-qualification/source-inputs.json
      qualification_runner_label: exocortex-p7-ci-748addaa74
      qualification_bulk_inputs: /fixture/inputs/backend-inputs.json
      qualification_bulk_private_base: /fixture/native-private
